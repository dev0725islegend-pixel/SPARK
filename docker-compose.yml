version: '3.8'

services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: spark
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - spark

  redis:
    image: redis:7
    restart: unless-stopped
    volumes:
      - redisdata:/data
    networks:
      - spark

  inference:
    image: ghcr.io/your-org/glm-5.2-inference:latest
    # Replace the above with the actual local inference server image or host
    restart: unless-stopped
    networks:
      - spark
    environment:
      - MODEL_PORT=8000

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      - postgres
      - redis
      - inference
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=spark
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=change_me_to_a_long_random_value
      - MODEL_API_URL=http://inference:8000
      - CORS_ALLOWED_ORIGINS=http://localhost:3000
    volumes:
      - ./backend/uploads:/app/uploads
    ports:
      - "8000:8000"
    networks:
      - spark

  nginx:
    image: nginx:stable
    depends_on:
      - frontend
      - backend
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    networks:
      - spark

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run build && npm run start"
    networks:
      - spark
    ports:
      - "3000:3000"

volumes:
  pgdata:
  redisdata:

networks:
  spark:
    driver: bridge
